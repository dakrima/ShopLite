name: ShopLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoplite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: pruebas-frontend
          path: test-results/
          retention-days: 7

  preparar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Preparar archivos estáticos y sitemap
        env:
          URL_PUBLICA: ${{ steps.pages.outputs.base_url }}
        run: node herramientas/preparar_publicacion.cjs "$URL_PUBLICA"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: despliegue
        uses: actions/deploy-pages@v4
